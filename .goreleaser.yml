version: 2

project_name: rodin3d-mcp

before:
  hooks:
    # The release fails when the notices do not match the linked modules.
    - go run ./tools/notices -check

builds:
  - id: rodin3d-mcp
    main: .
    binary: rodin3d-mcp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [binary]
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: SHA256SUMS.txt

release:
  github:
    owner: sairaph
    name: rodin3d-mcp
  # Tags like v0.1.1-rc.1 publish as pre-releases, which /releases/latest
  # (the install scripts and `update`) never picks.
  prerelease: auto
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
    - glob: ./THIRD_PARTY_NOTICES.txt

changelog:
  disable: true
